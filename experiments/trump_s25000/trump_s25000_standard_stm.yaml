    parameters:
      k: 10
  - id: "stm_k20"
    parameters:
      k: 20
  - id: "stm_k30"
    parameters:
      k: 30
  - id: "stm_k40"
    parameters:
      k: 40
  - id: "stm_k50"
    parameters:
      k: 50
