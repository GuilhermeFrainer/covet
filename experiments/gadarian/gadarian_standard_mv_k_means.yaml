extends: "datasets/gadarian.yaml"

experiment:
  name: "gadarian_standard_mv_k_means"
  description: "UMAP + Multi-View K-Means on gadarian with standard topic counts."
  random_state:
    - 36201624
    - 62613654
    - 57116123
  decimal_digits: 3

model:
  id: "mv_k_means"
  description: "UMAP + Multi-View K-Means"
  dimensionality_reduction:
    type: "umap"
    params:
      n_components: 5
      n_neighbors: 15
      min_dist: 0.0
      metric: "cosine"
      low_memory: false
  clustering:
    type: "multi_view_k_means"
    params:
      n_clusters:
        - 4
        - 6
        - 8
        - 10
        - 12
