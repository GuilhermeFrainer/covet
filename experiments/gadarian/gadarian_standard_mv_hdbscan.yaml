extends: "datasets/gadarian.yaml"

experiment:
  name: "gadarian_standard_mv_hdbscan"
  description: "Multi-View HDBSCAN with baseline-matched UMAP dimensions and topic-count targets on gadarian."
  random_state:
    - 36201624
    - 62613654
    - 57116123
  decimal_digits: 3

model:
  id: "mv_hdbscan"
  description: "BERTopic with Multi-View HDBSCAN and the dataset baseline UMAP and topic-count settings."
  is_baseline: false
  dimensionality_reduction:
    type: "umap"
    params:
      n_components: 5
      n_neighbors: 15
      min_dist: 0.0
      metric: "cosine"
      low_memory: false
  clustering:
    type: "multi_view_hdbscan"
    params:
      min_cluster_size: 5
      fusion: "max"
      scale_views: true
  bertopic:
    params:
      nr_topics:
        - 4
        - 6
        - 8
        - 10
        - 12
