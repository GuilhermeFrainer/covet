extends: "datasets/gadarian.yaml"

experiment:
  name: "gadarian_standard_stm"
  # Spectral initialization makes STM deterministic: other seeds refit the same model.
  random_state:
    - 36201624
  prevalence_formula: '~ as.factor(treatment) + as.factor(partisanship) + as.factor(treatment):as.factor(partisanship)'

models:
  - id: "stm_k4"
    parameters:
      k: 4
  - id: "stm_k6"
    parameters:
      k: 6
  - id: "stm_k8"
    parameters:
      k: 8
  - id: "stm_k10"
    parameters:
      k: 10
  - id: "stm_k12"
    parameters:
      k: 12
