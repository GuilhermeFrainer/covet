extends: "datasets/gadarian.yaml"

experiment:
  name: "gadarian_standard_tritopic"
  description: "Standard TriTopic model (tri-modal graph topic modeling) on gadarian dataset with standard topic counts."
  random_state:
    - 36201624
    - 62613654
    - 57116123
  decimal_digits: 3

model:
  id: "tritopic"
  description: "TriTopic multi-view graph topic model with consensus Leiden clustering."
  type: "tritopic"
  params:
    verbose: false
    keyword_ngram_range: [1, 1]
    n_topics:
      - 4
      - 6
      - 8
      - 10
      - 12
