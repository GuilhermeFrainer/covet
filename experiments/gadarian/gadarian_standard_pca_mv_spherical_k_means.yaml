extends: "datasets/gadarian.yaml"

experiment:
  name: "gadarian_standard_pca_mv_spherical_k_means"
  description: "PCA + Multi-View Spherical K-Means on gadarian with standard topic counts."
  random_state:
    - 36201624
    - 62613654
    - 57116123
  decimal_digits: 3

model:
  id: "pca_mv_spherical_k_means"
  description: "PCA + Multi-View Spherical K-Means"
  dimensionality_reduction:
    type: "pca"
    params:
      n_components: 5
  clustering:
    type: "multi_view_spherical_k_means"
    params:
      n_clusters:
        - 4
        - 6
        - 8
        - 10
        - 12
