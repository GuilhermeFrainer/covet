extends: "datasets/gadarian.yaml"

experiment:
  name: "gadarian_standard_mv_co_reg_spectral"
  description: "Multi-View Co-Regularized Spectral Clustering on gadarian with standard topic counts."
  random_state:
    - 36201624
    - 62613654
    - 57116123
  decimal_digits: 3

model:
  id: "mv_co_reg_spectral"
  description: "Multi-View Co-Regularized Spectral Clustering"
  dimensionality_reduction:
    type: "umap"
    params:
      n_components: 5
      n_neighbors: 15
      min_dist: 0.0
      metric: "cosine"
      low_memory: false
  clustering:
    type: "co_regularized_multi_view_spectral_clustering"
    params:
      n_clusters:
        - 4
        - 6
        - 8
        - 10
        - 12
