extends: datasets/anes_stemmed.yaml
experiment:
  name: anes_stemmed_standard_stm
  # Spectral initialization makes STM deterministic: other seeds refit the same model.
  random_state:
  - 36201624
  prevalence_formula: ~ as.factor(party_id) + years_of_education + age + as.factor(party_id):age
models:
- id: stm_k10
  parameters:
    k: 10
- id: stm_k20
  parameters:
    k: 20
- id: stm_k30
  parameters:
    k: 30
- id: stm_k40
  parameters:
    k: 40
- id: stm_k50
  parameters:
    k: 50
