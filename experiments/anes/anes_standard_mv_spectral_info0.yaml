extends: "datasets/anes.yaml"

experiment:
  name: "anes_standard_mv_spectral_info0"
  description: "Multi-View Spectral Clustering (info_view=0) on anes with standard topic counts."
  random_state:
    - 36201624
    - 62613654
    - 57116123
  decimal_digits: 3

model:
  id: "mv_spectral_info0"
  description: "Multi-View Spectral Clustering (info_view=0)"
  dimensionality_reduction:
    type: "umap"
    params:
      n_components: 5
      n_neighbors: 15
      min_dist: 0.0
      metric: "cosine"
      low_memory: false
  clustering:
    type: "multi_view_spectral_clustering"
    params:
      info_view: 0
      n_clusters:
        - 8
        - 11
        - 14
        - 17
        - 20
