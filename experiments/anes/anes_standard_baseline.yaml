extends: "datasets/anes.yaml"

experiment:
  name: "anes_standard_baseline"
  description: "Standard baseline model (simplified UMAP + HDBSCAN) on anes with standard topic counts."
  random_state:
    - 36201624
    - 62613654
    - 57116123
  decimal_digits: 3

model:
  id: "baseline"
  description: "Standard BERTopic: no metadata and default hyperparameters (simplified config)."
  is_baseline: true
  dimensionality_reduction:
    type: "umap"
    params:
      n_components: 5
      n_neighbors: 15
      min_dist: 0.0
      metric: "cosine"
      low_memory: false
  clustering:
    type: "hdbscan"
    params:
      min_cluster_size: 5
      prediction_data: true
      prediction_data: true
  bertopic:
    params:
      nr_topics:
        - 8
        - 11
        - 14
        - 17
        - 20
