extends: "datasets/anes.yaml"

experiment:
  name: "anes_standard_fast_tritopic"
  description: "Fast TriTopic model (vectorized tri-modal graph topic modeling) on anes dataset with standard topic counts."
  random_state:
    - 36201624
    - 62613654
    - 57116123
  decimal_digits: 3

model:
  id: "fast_tritopic"
  description: "Fast TriTopic multi-view graph topic model with vectorized graph construction."
  type: "fast_tritopic"
  params:
    verbose: false
    keyword_ngram_range: [1, 1]
    n_topics:
      - 8
      - 11
      - 14
      - 17
      - 20
