extends: "datasets/anes.yaml"

experiment:
  name: "anes_standard_stm"
  # Spectral initialization makes STM deterministic: other seeds refit the same model.
  random_state:
    - 36201624
  prevalence_formula: '~ as.factor(party_id) + years_of_education + age + as.factor(party_id):age'

models:
  - id: "stm_k8"
    parameters:
      k: 8
  - id: "stm_k11"
    parameters:
      k: 11
  - id: "stm_k14"
    parameters:
      k: 14
  - id: "stm_k17"
    parameters:
      k: 17
  - id: "stm_k20"
    parameters:
      k: 20
