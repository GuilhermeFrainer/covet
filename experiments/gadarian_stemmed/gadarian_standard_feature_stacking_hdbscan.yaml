extends: datasets/gadarian_stemmed.yaml
experiment:
  name: gadarian_stemmed_standard_feature_stacking_hdbscan
  description: Feature-Stacking HDBSCAN with baseline-matched UMAP dimensions and
    topic-count targets on gadarian_stemmed.
  random_state:
  - 36201624
  - 62613654
  - 57116123
  decimal_digits: 3
model:
  id: feature_stacking_hdbscan
  description: BERTopic with Feature-Stacking HDBSCAN and the dataset baseline UMAP
    and topic-count settings.
  is_baseline: false
  dimensionality_reduction:
    type: umap
    params:
      n_components: 5
      n_neighbors: 15
      min_dist: 0.0
      metric: cosine
      low_memory: false
  clustering:
    type: feature_stacking_hdbscan
    params:
      min_cluster_size: 5
      standardize: true
  bertopic:
    params:
      nr_topics:
      - 10
      - 20
      - 30
      - 40
      - 50
