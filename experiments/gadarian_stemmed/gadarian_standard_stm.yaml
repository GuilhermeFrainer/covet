extends: datasets/gadarian_stemmed.yaml
experiment:
  name: gadarian_stemmed_standard_stm
  # Spectral initialization makes STM deterministic: other seeds refit the same model.
  random_state:
  - 36201624
  prevalence_formula: ~ as.factor(treatment) + as.factor(partisanship) + as.factor(treatment):as.factor(partisanship)
models:
- id: stm_k10
  parameters:
    k: 10
- id: stm_k20
  parameters:
    k: 20
- id: stm_k30
  parameters:
    k: 30
- id: stm_k40
  parameters:
    k: 40
- id: stm_k50
  parameters:
    k: 50
