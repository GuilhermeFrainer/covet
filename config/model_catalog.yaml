# Model presentation policy; independent of dataset, seeds and preprocessing.
# Priority is explicit: family membership never promotes a secondary model.
schema_version: 1
models:
  aligned_umap:
    label: BERTopic with Aligned UMAP integration.
    priority: primary
    role: ablation
    family: hdbscan
    baseline_id: baseline
    reduction: aligned_umap
    clustering: hdbscan
    short_label: "Aligned UMAP"
    latex_label: '$\text{\systemshort}_\text{Al}$'
    change: "Replaces UMAP with Aligned UMAP across the text and metadata views."
  aligned_umap_mv_k_means:
    label: Aligned UMAP + Multi-View K-Means
    priority: secondary
    role: ablation
    family: k_means
    baseline_id: pca_k_means
    reduction: aligned_umap
    clustering: multi_view_k_means
  aligned_umap_mv_spherical_k_means:
    label: Aligned UMAP + Multi-View Spherical K-Means
    priority: secondary
    role: ablation
    family: k_means
    baseline_id: pca_k_means
    reduction: aligned_umap
    clustering: multi_view_spherical_k_means
  append_umap:
    label: BERTopic with naive (unweighted) Append UMAP.
    priority: primary
    role: ablation
    family: hdbscan
    baseline_id: baseline
    reduction: append_umap
    clustering: hdbscan
    short_label: "Append UMAP"
    latex_label: '$\text{\systemshort}_\text{Ap}$'
    change: "Concatenates scaled, unweighted metadata to the text embeddings before UMAP."
  append_umap_w000:
    label: BERTopic with weighted Append UMAP (w=0, metadata ignored; parity check).
    priority: primary
    role: ablation
    family: hdbscan
    baseline_id: baseline
    reduction: append_umap
    clustering: hdbscan
    short_label: "Weighted Append UMAP (w = 0)"
    latex_label: '$\text{\systemshort}_\text{Ap}^{w=0}$'
    change: "Distance-balances text and metadata blocks before Euclidean UMAP; w = 0 ignores metadata (parity check)."
  append_umap_w005:
    label: BERTopic with weighted Append UMAP (w=0.05).
    priority: primary
    role: ablation
    family: hdbscan
    baseline_id: baseline
    reduction: append_umap
    clustering: hdbscan
    short_label: "Weighted Append UMAP (w = 0.05)"
    latex_label: '$\text{\systemshort}_\text{Ap}^{w=0.05}$'
    change: "Distance-balanced Append UMAP with metadata weight w = 0.05."
  append_umap_w010:
    label: BERTopic with weighted Append UMAP (w=0.1).
    priority: primary
    role: ablation
    family: hdbscan
    baseline_id: baseline
    reduction: append_umap
    clustering: hdbscan
    short_label: "Weighted Append UMAP (w = 0.1)"
    latex_label: '$\text{\systemshort}_\text{Ap}^{w}$'
    change: "Distance-balanced Append UMAP with metadata weight w = 0.1."
  append_umap_w020:
    label: BERTopic with weighted Append UMAP (w=0.2).
    priority: primary
    role: ablation
    family: hdbscan
    baseline_id: baseline
    reduction: append_umap
    clustering: hdbscan
    short_label: "Weighted Append UMAP (w = 0.2)"
    latex_label: '$\text{\systemshort}_\text{Ap}^{w=0.2}$'
    change: "Distance-balanced Append UMAP with metadata weight w = 0.2."
  append_umap_w030:
    label: BERTopic with weighted Append UMAP (w=0.3).
    priority: primary
    role: ablation
    family: hdbscan
    baseline_id: baseline
    reduction: append_umap
    clustering: hdbscan
    short_label: "Weighted Append UMAP (w = 0.3)"
    latex_label: '$\text{\systemshort}_\text{Ap}^{w=0.3}$'
    change: "Distance-balanced Append UMAP with metadata weight w = 0.3."
  append_umap_w050:
    label: BERTopic with weighted Append UMAP (w=0.5).
    priority: primary
    role: ablation
    family: hdbscan
    baseline_id: baseline
    reduction: append_umap
    clustering: hdbscan
    short_label: "Weighted Append UMAP (w = 0.5)"
    latex_label: '$\text{\systemshort}_\text{Ap}^{w=0.5}$'
    change: "Distance-balanced Append UMAP with metadata weight w = 0.5."
  append_umap_mv_co_reg_spectral:
    label: Append UMAP + Multi-View Co-Regularized Spectral Clustering
    priority: secondary
    role: ablation
    family: spectral
    baseline_id: umap_spectral
    reduction: append_umap
    clustering: co_regularized_multi_view_spectral_clustering
  append_umap_mv_co_reg_spectral_info0:
    label: Append UMAP + Multi-View Co-Regularized Spectral Clustering (info_view=0)
    priority: secondary
    role: ablation
    family: spectral
    baseline_id: umap_spectral
    reduction: append_umap
    clustering: co_regularized_multi_view_spectral_clustering
  append_umap_mv_k_means:
    label: Append UMAP + Multi-View K-Means
    priority: secondary
    role: ablation
    family: k_means
    baseline_id: pca_k_means
    reduction: append_umap
    clustering: multi_view_k_means
  append_umap_mv_spectral:
    label: Append UMAP + Multi-View Spectral Clustering
    priority: secondary
    role: ablation
    family: spectral
    baseline_id: umap_spectral
    reduction: append_umap
    clustering: multi_view_spectral_clustering
  append_umap_mv_spectral_info0:
    label: Append UMAP + Multi-View Spectral Clustering (info_view=0)
    priority: secondary
    role: ablation
    family: spectral
    baseline_id: umap_spectral
    reduction: append_umap
    clustering: multi_view_spectral_clustering
  append_umap_mv_spherical_k_means:
    label: Append UMAP + Multi-View Spherical K-Means
    priority: secondary
    role: ablation
    family: k_means
    baseline_id: pca_k_means
    reduction: append_umap
    clustering: multi_view_spherical_k_means
  baseline:
    label: UMAP + HDBSCAN
    priority: primary
    role: baseline
    family: hdbscan
    baseline_id: null
    reduction: umap
    clustering: hdbscan
    short_label: "UMAP + HDBSCAN"
    latex_label: '$\text{BERTopic}_\text{H}$'
    change: "Text-only reference; no metadata."
  decoupled_mv_k_means:
    label: UMAP + Decoupled Multi-View K-Means (Cosine Text + Euclidean Metadata)
    priority: secondary
    role: ablation
    family: k_means
    baseline_id: pca_k_means
    reduction: umap
    clustering: decoupled_multi_view_k_means
  decoupled_mv_spectral:
    label: UMAP + Decoupled Multi-View Spectral Clustering (Cosine Text + Euclidean
      RBF Metadata)
    priority: primary
    role: ablation
    family: spectral
    baseline_id: umap_spectral
    reduction: umap
    clustering: decoupled_multi_view_spectral_clustering
    short_label: "Decoupled MV Spectral"
    latex_label: '$\text{\systemshort}_\text{DS}$'
    change: "Multi-view spectral clustering with view-specific affinities: cosine kNN on text, Euclidean RBF on metadata."
  fast_tritopic:
    label: Fast TriTopic multi-view graph topic model with vectorized graph construction.
    priority: primary
    role: external_baseline
    family: external
    baseline_id: null
    reduction: none
    clustering: none
    short_label: "FastTriTopic"
    change: "TriTopic with vectorized graph construction."
  feature_stacking_hdbscan:
    label: UMAP + Feature-Stacking HDBSCAN
    priority: primary
    role: ablation
    family: hdbscan
    baseline_id: baseline
    reduction: umap
    clustering: feature_stacking_hdbscan
    short_label: "Feature-Stacking HDBSCAN"
    latex_label: '$\text{\systemshort}_\text{FS}$'
    change: "Runs HDBSCAN on standardized, horizontally stacked text and metadata views."
  k_means:
    label: UMAP + K-Means
    priority: secondary
    role: ablation
    family: k_means
    baseline_id: pca_k_means
    reduction: umap
    clustering: k_means
  mv_co_reg_spectral:
    label: Multi-View Co-Regularized Spectral Clustering
    priority: primary
    role: ablation
    family: spectral
    baseline_id: umap_spectral
    reduction: umap
    clustering: co_regularized_multi_view_spectral_clustering
    short_label: "Co-Reg. MV Spectral"
    latex_label: '$\text{\systemshort}_\text{CR}$'
    change: "Replaces single-view spectral clustering with co-regularized multi-view spectral clustering over the text and metadata views."
  # mvlearn's co-regularized clustering ignores info_view, so this is the same
  # model as mv_co_reg_spectral. Kept so archived results stay classified.
  mv_co_reg_spectral_info0:
    label: Multi-View Co-Regularized Spectral Clustering (info_view=0)
    priority: secondary
    role: ablation
    family: spectral
    baseline_id: umap_spectral
    reduction: umap
    clustering: co_regularized_multi_view_spectral_clustering
    short_label: "Co-Reg. MV Spectral (info_view = 0)"
    latex_label: '$\text{\systemshort}_\text{CR-info0}$'
    change: "Same as Co-Reg. MV Spectral: mvlearn's co-regularized clustering ignores info_view."
  mv_hdbscan:
    label: UMAP + MV-HDBSCAN
    priority: primary
    role: ablation
    family: hdbscan
    baseline_id: baseline
    reduction: umap
    clustering: multi_view_hdbscan
    short_label: "MV-HDBSCAN"
    latex_label: '$\text{\systemshort}_\text{MH}$'
    change: "Replaces HDBSCAN with multi-view HDBSCAN over the text and metadata views."
    aliases:
    - umap_mv_hdbscan
    - multi_view_hdbscan
  mv_k_means:
    label: UMAP + Multi-View K-Means
    priority: secondary
    role: ablation
    family: k_means
    baseline_id: pca_k_means
    reduction: umap
    clustering: multi_view_k_means
  mv_k_means_l2_norm:
    label: UMAP + Multi-View K-Means (L2-Normalized Text View)
    priority: secondary
    role: ablation
    family: k_means
    baseline_id: pca_k_means
    reduction: umap
    clustering: multi_view_k_means
  mv_spectral:
    label: Multi-View Spectral Clustering
    priority: primary
    role: ablation
    family: spectral
    baseline_id: umap_spectral
    reduction: umap
    clustering: multi_view_spectral_clustering
    short_label: "Co-Train. MV Spectral"
    latex_label: '$\text{\systemshort}_\text{CT}$'
    change: "Replaces single-view spectral clustering with multi-view spectral clustering over the text and metadata views; affinity construction also differs."
  mv_spectral_info0:
    label: Multi-View Spectral Clustering (info_view=0)
    priority: primary
    role: ablation
    family: spectral
    baseline_id: umap_spectral
    reduction: umap
    clustering: multi_view_spectral_clustering
    short_label: "MV Spectral (info_view = 0)"
    latex_label: '$\text{\systemshort}_\text{CT-info0}$'
    change: "As MV Spectral, but the final clustering uses the text view's embedding only."
  mv_spectral_l2_norm:
    label: UMAP + Multi-View Spectral Clustering (L2-Normalized Text View)
    priority: primary
    role: ablation
    family: spectral
    baseline_id: umap_spectral
    reduction: umap
    clustering: multi_view_spectral_clustering
    short_label: "MV Spectral (L2-normalized text)"
    latex_label: '$\text{\systemshort}_\text{CT-L2}$'
    change: "As MV Spectral, with an L2-normalized text view."
  mv_spherical_k_means:
    label: UMAP + Multi-View Spherical K-Means
    priority: secondary
    role: ablation
    family: k_means
    baseline_id: pca_k_means
    reduction: umap
    clustering: multi_view_spherical_k_means
  pca_hdbscan:
    label: PCA + HDBSCAN (no metadata).
    priority: secondary
    role: ablation
    family: hdbscan
    baseline_id: baseline
    reduction: pca
    clustering: hdbscan
  pca_k_means:
    label: PCA + K-Means
    priority: primary
    role: baseline
    family: k_means
    baseline_id: null
    reduction: pca
    clustering: k_means
    short_label: "PCA + K-Means"
    latex_label: '$\text{BERTopic}_\text{K}$'
    change: "Text-only reference; no metadata."
  pca_mv_co_reg_spectral:
    label: PCA + Multi-View Co-Regularized Spectral Clustering
    priority: secondary
    role: ablation
    family: spectral
    baseline_id: umap_spectral
    reduction: pca
    clustering: co_regularized_multi_view_spectral_clustering
  pca_mv_co_reg_spectral_info0:
    label: PCA + Multi-View Co-Regularized Spectral Clustering (info_view=0)
    priority: secondary
    role: ablation
    family: spectral
    baseline_id: umap_spectral
    reduction: pca
    clustering: co_regularized_multi_view_spectral_clustering
  pca_mv_k_means:
    label: PCA + Multi-View K-Means
    priority: primary
    role: ablation
    family: k_means
    baseline_id: pca_k_means
    reduction: pca
    clustering: multi_view_k_means
    short_label: "PCA + MV K-Means"
    latex_label: '$\text{\systemshort}_\text{MK}$'
    change: "Replaces K-Means with multi-view K-Means over the text and metadata views."
  pca_mv_spectral:
    label: PCA + Multi-View Spectral Clustering
    priority: secondary
    role: ablation
    family: spectral
    baseline_id: umap_spectral
    reduction: pca
    clustering: multi_view_spectral_clustering
  pca_mv_spectral_info0:
    label: PCA + Multi-View Spectral Clustering (info_view=0)
    priority: secondary
    role: ablation
    family: spectral
    baseline_id: umap_spectral
    reduction: pca
    clustering: multi_view_spectral_clustering
  pca_mv_spherical_k_means:
    label: PCA + Multi-View Spherical K-Means
    priority: primary
    role: ablation
    family: k_means
    baseline_id: pca_k_means
    reduction: pca
    clustering: multi_view_spherical_k_means
    short_label: "PCA + MV Spherical K-Means"
    latex_label: '$\text{\systemshort}_\text{SK}$'
    change: "Replaces K-Means with multi-view spherical (cosine) K-Means over the text and metadata views."
  pca_spectral:
    label: PCA + Single-View Spectral Clustering
    priority: secondary
    role: ablation
    family: spectral
    baseline_id: umap_spectral
    reduction: pca
    clustering: spectral_clustering
  stm:
    label: STM
    priority: primary
    role: external_baseline
    family: external
    baseline_id: null
    reduction: none
    clustering: none
    short_label: "STM"
    change: "Structural Topic Model with document covariates."
  tritopic:
    label: TriTopic multi-view graph topic model with consensus Leiden clustering.
    priority: primary
    role: external_baseline
    family: external
    baseline_id: null
    reduction: none
    clustering: none
    short_label: "TriTopic"
    change: "Multi-view graph topic model with consensus Leiden clustering."
  umap_spectral:
    label: UMAP + Spectral
    priority: primary
    role: baseline
    family: spectral
    baseline_id: null
    reduction: umap
    clustering: spectral_clustering
    short_label: "UMAP + Spectral"
    latex_label: '$\text{BERTopic}_\text{S}$'
    change: "Text-only reference; no metadata."
