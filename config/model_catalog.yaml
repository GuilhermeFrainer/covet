# Model presentation policy; independent of dataset, seeds and preprocessing.
# Priority is explicit: family membership never promotes a secondary model.
schema_version: 1
models:
  aligned_umap:
    label: BERTopic with Aligned UMAP integration.
    priority: primary
    role: ablation
    family: hdbscan
    baseline_id: baseline
    reduction: aligned_umap
    clustering: hdbscan
  aligned_umap_mv_k_means:
    label: Aligned UMAP + Multi-View K-Means
    priority: secondary
    role: ablation
    family: k_means
    baseline_id: pca_k_means
    reduction: aligned_umap
    clustering: multi_view_k_means
  aligned_umap_mv_spherical_k_means:
    label: Aligned UMAP + Multi-View Spherical K-Means
    priority: secondary
    role: ablation
    family: k_means
    baseline_id: pca_k_means
    reduction: aligned_umap
    clustering: multi_view_spherical_k_means
